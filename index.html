<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal SSC Padangsidimpuan</title> 
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f4f9;
        }

        .iframe-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            -webkit-overflow-scrolling: touch;
            overflow-y: auto;
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="iframe-wrapper">
        <iframe 
            class="iframe-container" 
            src="https://script.google.com/macros/s/AKfycbywR7I7GwyytxUMQZmCDic4FoZ5s2Kotn1mF1z2ba43kAgSx2r2znDUlk75O3_ZzoU6tw/exec" 
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
